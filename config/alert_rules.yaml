alerts:
  - name: high_latency_p95
    severity: warning
    condition: "latency_p95_ms > 3000 for 5 minutes"
    type: symptom-based
    owner: on-call-engineer
    runbook: docs/alerts.md#alert-1

  - name: elevated_error_rate
    severity: critical
    condition: "error_rate_pct > 2 for 3 minutes"
    type: symptom-based
    owner: on-call-engineer
    runbook: docs/alerts.md#alert-2

  - name: quality_degradation
    severity: warning
    condition: "quality_score_avg < 0.75 for 5 minutes"
    type: symptom-based
    owner: team-lead
    runbook: docs/alerts.md#alert-3
